name: Variability Showcase

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
    paths:
      - "src/**"
      - "Dockerfile"
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, production]
        default: staging
      skip_tests:
        description: "Skip test jobs"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * 1"
  repository_dispatch:
    types: [deploy-notify]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  # ── 1. ROOT (fan-out) ─────────────────────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.meta.outputs.build_id }}
      skip_tests: ${{ steps.check.outputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "build_id=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: check
        run: echo "skip_tests=${{ inputs.skip_tests || 'false' }}" >> "$GITHUB_OUTPUT"

  # ── 2. PARALLEL BRANCHES ──────────────────────────────────────────────────
  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci && npm run lint

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci && npx tsc --noEmit

  security-scan:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci && npm audit --audit-level=high

  # ── 3. MATRIX ─────────────────────────────────────────────────────────────
  test-unit:
    needs: [lint, typecheck, security-scan]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["18", "20", "22"]
        include:
          - os: ubuntu-latest
            node: "20"
            label: "primary"
          - os: macos-latest
            node: "22"
            label: "bleeding-edge"
        exclude:
          - os: windows-latest
            node: "18"
          - os: windows-latest
            node: "22"
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage
        env:
          MATRIX_LABEL: ${{ matrix.label }}

  # ── 4. DIAMOND ────────────────────────────────────────────────────────────
  build:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: node:20          # ← было node:20-slim (нет git)
      env:
        BUILD_MODE: production
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ needs.setup.outputs.build_id }}
          path: dist/

  build-docs:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run docs

  publish:
    needs: [setup, build, build-docs]   # ← добавлен setup
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: build-output-${{ needs.setup.outputs.build_id }}
          path: dist/
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # ← нужен secret

  # ── 5. SERVICE CONTAINERS ─────────────────────────────────────────────────
  test-integration:
    needs: [setup, test-unit]           # ← добавлен setup
    if: needs.setup.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          DATABASE_URL: postgres://postgres:secret@localhost:5432/app_test
          REDIS_URL: redis://localhost:6379

  # ── 6. CONDITIONAL DEPLOYS ────────────────────────────────────────────────
  deploy-staging:
    needs: [setup, test-integration, publish]   # ← добавлен setup
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Deploying to staging, build ${{ needs.setup.outputs.build_id }}"

  deploy-production:
    needs: [setup, test-integration, publish]   # ← добавлен setup
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Deploying to production, build ${{ needs.setup.outputs.build_id }}"

  # ── 7. CONDITIONAL NOTIFICATIONS ──────────────────────────────────────────
  notify-pr:
    needs: [test-unit, test-integration]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "PR checks passed for ${{ github.head_ref }}"

  notify-release:
    needs: [setup, publish]             # ← добавлен setup (для build_id в будущем)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Released ${{ github.ref_name }}"

  # ── 8. always() ───────────────────────────────────────────────────────────
  cleanup:
    if: always()
    needs: [setup, build, publish, deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "build:   ${{ needs.build.result }}"
          echo "publish: ${{ needs.publish.result }}"

  # ── 9. OUTPUT CHAIN ───────────────────────────────────────────────────────
  analyze-coverage:
    needs: [test-unit]
    if: always() && needs.test-unit.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      coverage_pct: ${{ steps.threshold.outputs.coverage }}
      passed: ${{ steps.threshold.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: threshold
        run: |
          pct=87
          echo "coverage=$pct" >> "$GITHUB_OUTPUT"
          if [ "$pct" -ge 80 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  quality-gate:
    needs: [analyze-coverage]
    if: needs.analyze-coverage.outputs.passed == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Coverage ${{ needs.analyze-coverage.outputs.coverage_pct }}% below threshold"
          exit 1

  # ── 10. CONTAINER ─────────────────────────────────────────────────────────
  perf-test:
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: grafana/k6:latest          # git нет → checkout убран
    steps:
      - run: echo "k6 benchmark placeholder"

  # ── 11. SMOKE TEST ────────────────────────────────────────────────────────
  smoke-test:
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Smoke test passed"

  # ── 12. FINAL GATE ────────────────────────────────────────────────────────
  report:
    needs:
      - setup
      - lint
      - typecheck
      - security-scan
      - test-unit
      - test-integration
      - build
      - build-docs
      - publish
      - deploy-staging
      - deploy-production
      - cleanup
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "=== PIPELINE SUMMARY ==="
          echo "setup:       ${{ needs.setup.result }}"
          echo "lint:        ${{ needs.lint.result }}"
          echo "typecheck:   ${{ needs.typecheck.result }}"
          echo "security:    ${{ needs.security-scan.result }}"
          echo "test-unit:   ${{ needs.test-unit.result }}"
          echo "test-int:    ${{ needs.test-integration.result }}"
          echo "build:       ${{ needs.build.result }}"
          echo "build-docs:  ${{ needs.build-docs.result }}"
          echo "publish:     ${{ needs.publish.result }}"
          echo "deploy-stg:  ${{ needs.deploy-staging.result }}"
          echo "deploy-prd:  ${{ needs.deploy-production.result }}"
          echo "cleanup:     ${{ needs.cleanup.result }}"
